<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background-color: #e0e0e0;
            cursor: pointer;
            flex-grow: 1;
            text-align: center;
            border-radius: 5px 5px 0 0;
            text-decoration: none;
            color: #000;
            margin: 0 5px;
        }

        .tab.active {
            background-color: #4CAF50;
            color: white;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="text"] {
            -moz-appearance: textfield;
        }

        input[type="text"]::-webkit-outer-spin-button,
        input[type="text"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            background-color: #333;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

    </style>
</head>
<body>
    <h1 style="align-content: center">Unit Converter</h1>
    <nav class="tabs">
        <a href="length.jsp" class="tab">Length</a>
        <a href="temperature.jsp" class="tab">Temperature</a>
        <a href="weight.jsp" class="tab">Weight</a>
    </nav>
</body>
</html>
